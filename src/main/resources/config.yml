# MidiBox keeps original .mid/.midi source files in plugins/MidiBox/songs.
# Compiled playback plans will eventually be stored in plugins/MidiBox/cache.
playback:
  default-volume: 0.70
  max-voices-per-player: 48
  # Hard cap on MIDI controller/note events handled for one player in a server tick.
  max-events-per-tick: 512
  # After a serious lag spike, quietly discard stale soft accompaniment rather than burst it late.
  late-drop-threshold-millis: 150
  late-drop-velocity-threshold: 72
  trailing-silence-millis: 1000
  pitch-bend-range-semitones: 2.0
  # Native note blocks cannot truly sustain. This gently re-triggers held notes while pedal is down.
  sustain-refresh-millis: 350
  # Native Minecraft playback is server-tick-bound (20 Hz).
  # Future enhanced playback can use the same compiled song plan.
  mode: NOTE_BLOCK_AUTHENTIC
  timing:
    # Keeps the start of a song off the network's critical path. This is not audible silence.
    pre-roll-millis: 200
    # One tick of packet look-ahead prevents the scheduler boundary from making attacks arrive late.
    outbound-lookahead-millis: 50
    # Dispatches each player's notes about one half round-trip ping early, while retaining one shared song clock.
    ping-compensation: true
    max-ping-compensation-millis: 150
    # When the server falls behind, preserve drums, bass attacks, and strong melody notes first.
    adaptive-quality: true
    adaptive-lag-threshold-millis: 100

library:
  recursive-folders: true
  accepted-extensions: [mid, midi]

# Cache files are automatic and safe to delete; they are rebuilt from source MIDI files.
compiler:
  cache-format: MBC3

# Optional per-song overrides live alongside the MIDI as <song>.song.yml.
# channels are zero-based MIDI channel numbers; channel 9 is percussion.
# Example:
# transpose: 0
# channels:
#   "0":
#     transpose: -12
#     sound: GUITAR

ui:
  title: "MidiBox"
  songs-per-page: 45

jukebox:
  default-radius: 50

# Optional high-fidelity layer. Keep disabled until the pack ZIP is hosted over HTTP(S).
# Players who decline always receive the native note-block arrangement instead.
enhanced-audio:
  enabled: false
  auto-request: true
  required: false
  resource-pack:
    url: ""
    sha1: ""
    prompt: "MidiBox offers an optional high-fidelity instrument pack."
