name: MidiBox
version: '${version}'
main: dev.ryder.midibox.MidiBoxPlugin
description: Play MIDI songs with Minecraft note-block sounds.
api-version: '1.21'
authors: [Ryder]
commands:
  music:
    description: Open and control the MidiBox player.
    usage: /music [list|play|stop|pause|resume|volume|jukebox|orchestra|pack|history|playlist|analyze|reload]
    aliases: [midibox, mb]
permissions:
  midibox.use:
    description: Use the MidiBox player.
    default: true
  midibox.admin:
    description: Reload the MidiBox library and configuration.
    default: op
  midibox.play.others:
    description: Play music for another player.
    default: op
  midibox.play.radius:
    description: Play music to players in a radius.
    default: op
  midibox.play.global:
    description: Play music for every online player.
    default: op
